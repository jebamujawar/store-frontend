<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Checkout</h1>
  <nav>
    <a href="login.html" id="authLink">Login/Logout</a>
    <a href="cart.html">Back to Store</a>
  </nav>
</header>

<main>
  <h2>Your Cart</h2>
  <div id="cartContainer" class="cart-grid">
    <!-- Cart items will be rendered here -->
  </div>
  <div id="checkoutSummary">
    <p>Total: $<span id="cartTotal">0</span></p>
    <button id="checkoutBtn">Place Order</button>
  </div>
</main>

<script src="store.js"></script>
<script src="store-products.js"></script>
<script>
  // Render cart and calculate total
  function calculateTotal() {
    const total = cart.reduce((sum, item) => sum + item.price, 0);
    document.getElementById("cartTotal").textContent = total.toFixed(2);
  }

  // Checkout button click
  document.getElementById("checkoutBtn").addEventListener("click", () => {
    if (cart.length === 0) return alert("Your cart is empty!");
    alert(`Order placed successfully! Total: $${cart.reduce((sum, i) => sum + i.price, 0)}`);
    cart = [];
    saveCart();
    renderCart();
    calculateTotal();
  });

  // Update total on page load
  calculateTotal();
</script>
</body>
</html>
